server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
        path: /
        # 关键修改：移除 same-site: none 或改为 lax
        same-site: lax
        # 关键修改：设为 false 以兼容 HTTP
        secure: false
        http-only: true

spring:
  profiles:
    active: prod
  application:
    name: yun-picture-backend
  # 开放更大的文件上传体积
  servlet:
    multipart:
      max-file-size: 10MB
  # session 配置
  session:
    store-type: redis
    redis:
      configure-action: none
    # session 30 天过期
    timeout: 2592000

  # Cookie配置

# application.yml
sa-token:
  token-name: satoken
  timeout: 2592000

  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  active-timeout: -1


mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 仅在开发环境开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.zzx.yunpicturebackend.controller



